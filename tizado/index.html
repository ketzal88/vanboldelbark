<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Open Sans', sans-serif; background: #f2f2f2; color: #333; min-height: 100vh; display: flex; flex-direction: column; }

  .top-bar { height: 6px; background: #1a1a1a; width: 100%; }

  .header { background: #6b6b6b; height: 64px; display: flex; align-items: center; padding: 0 32px; width: 100%; }
  .header-inner { max-width: 1440px; margin: 0 auto; width: 100%; display: flex; align-items: center; justify-content: space-between; }

  .left-block { display: flex; align-items: center; gap: 18px; }
  .logo { border: 2px solid #fff; padding: 6px 14px 5px; display: inline-flex; align-items: center; border-radius: 3px; }
  .logo-text { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 3px; color: #fff; line-height: 1; display: flex; }
  .logo-text .accent { color: #c8102e; }
  .hdr-divider { width: 1px; height: 28px; background: rgba(255,255,255,0.45); }
  .tagline { color: #fff; font-size: 14px; font-weight: 400; letter-spacing: 0.2px; }

  .nav-items { display: flex; align-items: center; gap: 36px; }
  .nav-item { display: flex; align-items: center; gap: 9px; color: #d8d8d8; font-size: 14px; text-decoration: none; transition: color 0.2s ease; cursor: pointer; }
  .nav-item:hover { color: #fff; }
  .nav-item svg { width: 16px; height: 16px; fill: #d8d8d8; transition: fill 0.2s ease; }
  .nav-item:hover svg { fill: #fff; }
  .nav-item.whatsapp { color: #fff; font-weight: 400; }

  .wa-icon { width: 26px; height: 26px; background: #25D366; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .wa-icon svg { width: 16px; height: 16px; fill: #fff !important; }

  .anniversary { position: relative; width: 70px; height: 50px; display: flex; align-items: center; justify-content: center; }
  .anniversary .mark { font-family: 'Oswald', sans-serif; font-weight: 300; font-size: 32px; color: #fff; letter-spacing: 1px; line-height: 1; position: relative; z-index: 1; }
  .anniversary .stroke { position: absolute; top: 50%; left: 50%; width: 80px; height: 3px; background: #c8102e; transform: translate(-50%, -50%) rotate(-22deg); border-radius: 2px; z-index: 2; }
  .anniversary .years { position: absolute; bottom: -2px; right: -4px; font-family: 'Open Sans', sans-serif; font-size: 10px; color: #fff; font-weight: 300; letter-spacing: 1px; z-index: 3; }

  .subnav { background: #fff; height: 52px; display: flex; align-items: center; padding: 0 32px; border-bottom: 1px solid #e8e8e8; }
  .subnav-inner { max-width: 1440px; margin: 0 auto; width: 100%; display: flex; align-items: center; gap: 44px; }
  .subnav-item { color: #1a1a1a; font-size: 15px; font-weight: 400; text-decoration: none; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: color 0.2s ease; position: relative; padding: 8px 0; }
  .subnav-item:hover { color: #c8102e; }
  .subnav-item.active { font-weight: 700; }
  .subnav-item.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: #1a1a1a; }
  .chevron { width: 10px; height: 10px; fill: #1a1a1a; }

  main { flex: 1; max-width: 1440px; width: 100%; margin: 40px auto; padding: 0 24px; }

  .forms-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }

  .form-section h2 { font-size: 1.4rem; font-weight: 700; color: #333; margin-bottom: 20px; }

  .field-group { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .field-group.full { grid-template-columns: 1fr; }

  label { display: block; font-size: .75rem; font-weight: 600; color: #555; margin-bottom: 4px; }
  label .req { color: #a00; }

  input[type="text"], input[type="email"], input[type="tel"], select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid #ccc; background: #fff;
    font-family: inherit; font-size: .875rem; color: #333; outline: none;
    transition: border-color .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: #888; }
  textarea { height: 120px; resize: vertical; }
  select { cursor: pointer; }

  .btn-submit {
    display: inline-flex; align-items: center; gap: 8px;
    background: #555; color: #fff; border: none; padding: 10px 22px;
    font-family: inherit; font-size: .875rem; font-weight: 700; cursor: pointer;
    transition: background .15s; margin-top: 8px;
  }
  .btn-submit:hover { background: #333; }
  .btn-submit .arrow { font-size: 1rem; }

  .form-section:first-child { border-right: 1px solid #ddd; padding-right: 48px; }

  footer { background: #555; color: #ccc; text-align: center; padding: 18px; font-size: .75rem; margin-top: auto; }

  @media (max-width: 768px) {
    .forms-grid { grid-template-columns: 1fr; }
    .field-group { grid-template-columns: 1fr; }
    .hdr-divider, .tagline, .anniversary { display: none; }
    .nav-items { gap: 16px; }
    .nav-item span:not(.wa-icon) { display: none; }
    .subnav-inner { gap: 20px; overflow-x: auto; }
  }
</style>

var GHL_WEBHOOK = 'https://services.leadconnectorhq.com/hooks/KqrAuJu3oUHDyJOtRnta/webhook-trigger/1579e273-affb-4d26-a4ff-5f7fa65f1074';
var WA_NUMBER   = '5491XXXXXXXXX'; /* TODO: número real */

function handleTizadoForm(form, tag, originLabel) {
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var nombre   = form.querySelector('input[type="text"]').value.trim();
    var telefono = (form.querySelector('input[type="tel"]') || {}).value || '';
    var email    = (form.querySelector('input[type="email"]') || {}).value || '';
    if (!nombre) return;

    var btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;

    fetch(GHL_WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        firstName: nombre,
        phone:     telefono.trim(),
        email:     email.trim(),
        tags:      [tag, 'tipo-propietario'],
        source:    tag,
        customField: { origen_landing: originLabel },
      }),
    }).catch(function(){}).finally(function() {
      gtag('event', 'conversion', {'send_to': 'AW-18273599408/I4GHCKyU5cUcELD_w4lE'});
      var msg = encodeURIComponent('Hola! Quiero tasar mi propiedad en Nordelta. Completé el formulario, ¿podés contactarme?');
      var wa  = document.createElement('a');
      wa.href   = 'https://wa.me/' + WA_NUMBER + '?text=' + msg;
      wa.target = '_blank';
      wa.rel    = 'noopener noreferrer';
      wa.textContent = '✅ ¡Gracias! Escribinos por WhatsApp';
      wa.style.cssText = 'display:inline-block;margin-top:16px;background:#a00;color:#fff;padding:10px 20px;font-weight:700;text-decoration:none;font-size:.875rem';
      btn.replaceWith(wa);
    });
  });
}

var forms = document.querySelectorAll('form');
if (forms[0]) handleTizadoForm(forms[0], 'guerrilla-tizado-nordelta', 'tizadonordelta.com.ar');
if (forms[1]) handleTizadoForm(forms[1], 'guerrilla-tizado-nordelta', 'tizadonordelta.com.ar');
</script>
